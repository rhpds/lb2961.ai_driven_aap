---
instana_backend_port: "443"
instana_zone: "{{ guid }}"
instana_agent_http_listen: "127.0.0.1:42699"

instana_aap_org_name: "Instana AIOps"
instana_aap_project_name: "Instana AIOps Playbooks"
instana_aap_sensor_user: "instana-sensor"
instana_aap_sensor_password: "InstanaSensor{{ guid }}!"
instana_aap_gitea_credential_name: "Gitea"
instana_aap_lab_credential_name: "lab-credential"
instana_aap_inventory_name: "lab-inventory"
instana_aap_scm_branch: "main"
instana_gitea_scm_url: "https://github.com/ansible-tmm/aiops-summitlab.git"

aap_admin_user: "{{ ansible_automation_platform_configuration_username }}"
aap_admin_password: "{{ ansible_automation_platform_configuration_password }}"
instana_controller_url: "{{ controller_url | default(ansible_automation_platform_configuration_host) }}"

instana_webapp_dir: "/opt/lab-webapp"
instana_webapp_port: 8080
instana_webapp_service_name: "lab-webapp-{{ guid }}"

instana_traffic_interval: 5
