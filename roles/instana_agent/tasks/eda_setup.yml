---
- name: Create EDA project for Instana rulebooks
  ansible.builtin.uri:
    url: "{{ instana_controller_url }}/api/eda/v1/projects/"
    method: POST
    user: "{{ aap_admin_user | default('admin') }}"
    password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "ai-eda-instana-{{ guid }}"
      url: "{{ instana_gitea_scm_url }}"
      description: "Instana AIOps EDA rulebooks for {{ guid }}"
      organization_id: 1
    status_code: [200, 201]
  register: _eda_project
  become: false
  delegate_to: localhost

- name: Wait for EDA project sync to complete
  ansible.builtin.uri:
    url: "{{ instana_controller_url }}/api/eda/v1/projects/{{ _eda_project.json.id }}/"
    method: GET
    user: "{{ aap_admin_user | default('admin') }}"
    password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _eda_project_status
  become: false
  delegate_to: localhost
  retries: 20
  delay: 10
  until: _eda_project_status.json.import_state in ['completed', 'failed']

- name: Get all rulebooks for Instana EDA project
  ansible.builtin.uri:
    url: "{{ instana_controller_url }}/api/eda/v1/rulebooks/?project_id={{ _eda_project.json.id }}"
    method: GET
    user: "{{ aap_admin_user | default('admin') }}"
    password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _rulebooks
  become: false
  delegate_to: localhost

- name: Set instana rulebook ID fact
  ansible.builtin.set_fact:
    _instana_rulebook_id: "{{ (_rulebooks.json.results | selectattr('name', 'search', 'instana') | list | first).id | int }}"

- name: Get all decision environments
  ansible.builtin.uri:
    url: "{{ instana_controller_url }}/api/eda/v1/decision-environments/"
    method: GET
    user: "{{ aap_admin_user | default('admin') }}"
    password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _decision_envs
  become: false
  delegate_to: localhost

- name: Set decision environment ID fact
  ansible.builtin.set_fact:
    _de_id: "{{ (_decision_envs.json.results | first).id | int }}"

- name: Get AAP EDA credential ID
  ansible.builtin.uri:
    url: "{{ instana_controller_url }}/api/eda/v1/eda-credentials/?name=AAP"
    method: GET
    user: "{{ aap_admin_user | default('admin') }}"
    password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _eda_credential
  become: false
  delegate_to: localhost

- name: Create Instana AIOps EDA rulebook activation
  ansible.builtin.uri:
    url: "{{ instana_controller_url }}/api/eda/v1/activations/"
    method: POST
    user: "{{ aap_admin_user | default('admin') }}"
    password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "Instana AIOps | {{ guid }}"
      description: "Listens for Instana Smart Alert webhooks and triggers AAP remediation"
      project_id: "{{ _eda_project.json.id | int }}"
      rulebook_id: "{{ _instana_rulebook_id }}"
      decision_environment_id: "{{ _de_id }}"
      organization_id: 1
      eda_credential_ids: "{{ [_eda_credential.json.results[0].id | int] if _eda_credential.json.count > 0 else [] }}"
      log_level: info
      variables: |
        controller_url: {{ instana_controller_url }}
        aap_org: Default
        guid: {{ guid }}
    status_code: [200, 201]
  register: _eda_activation
  become: false
  delegate_to: localhost

- name: Show EDA activation details
  ansible.builtin.debug:
    msg: "EDA activation '{{ _eda_activation.json.name }}' created (id={{ _eda_activation.json.id }})"
