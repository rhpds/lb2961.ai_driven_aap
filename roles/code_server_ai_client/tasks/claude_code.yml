---
# Installs Claude Code CLI, VS Code extension, and configures
# settings and MCP servers.

- name: Install Claude Code CLI via npm
  become_user: "{{ student_name }}"
  ansible.builtin.shell:
    cmd: >-
      source /home/{{ student_name }}/.nvm/nvm.sh &&
      npm install -g {{ claude_code_npm_package }}@{{ claude_code_version }}
    executable: /bin/bash
  register: _claude_install
  changed_when: "'added' in _claude_install.stdout"

- name: Install Claude Code VS Code extension from VSIX URL
  when: claude_code_vsix_url | default('') | length > 0
  become_user: "{{ student_name }}"
  ansible.builtin.shell:
    cmd: >-
      code-server --install-extension {{ claude_code_vsix_url }}
    executable: /bin/bash
  register: _claude_ext
  changed_when: "'was successfully installed' in _claude_ext.stdout"
  failed_when: false

- name: Install Claude Code extension from marketplace (fallback)
  when:
    - _claude_ext is skipped or _claude_ext is failed or _claude_ext.rc | default(1) != 0
  become_user: "{{ student_name }}"
  ansible.builtin.shell:
    cmd: >-
      code-server --install-extension Anthropic.claude-code@{{ claude_code_version }}
    executable: /bin/bash
  register: _claude_ext_fallback
  changed_when: "'was successfully installed' in _claude_ext_fallback.stdout"
  failed_when: false

- name: Create Claude Code config directory
  ansible.builtin.file:
    path: "/home/{{ student_name }}/.claude"
    state: directory
    owner: "{{ student_name }}"
    mode: "0700"

- name: Determine API base URL
  ansible.builtin.set_fact:
    _claude_base_url: >-
      {{ 'http://127.0.0.1:' ~ ai_client_proxy_port
         if ai_client_proxy_enabled | bool
         else claude_code_base_url }}
    _claude_api_key: >-
      {{ ai_client_proxy_upstream_api_key
         if ai_client_proxy_enabled | bool
         else claude_code_api_key }}

- name: Place ~/.claude/settings.json (env vars and permissions)
  ansible.builtin.template:
    src: claude-global-settings.json.j2
    dest: "/home/{{ student_name }}/.claude/settings.json"
    owner: "{{ student_name }}"
    mode: "0600"

- name: Place ~/.claude.json (MCP servers)
  ansible.builtin.template:
    src: claude-settings.json.j2
    dest: "/home/{{ student_name }}/.claude.json"
    owner: "{{ student_name }}"
    mode: "0600"

- name: Place ~/CLAUDE.md project instructions
  ansible.builtin.template:
    src: CLAUDE.md.j2
    dest: "/home/{{ student_name }}/CLAUDE.md"
    owner: "{{ student_name }}"
    mode: "0644"

- name: Set Claude Code environment in .bashrc
  ansible.builtin.blockinfile:
    path: "/home/{{ student_name }}/.bashrc"
    marker: "# {mark} CLAUDE CODE ENV"
    block: |
      export ANTHROPIC_BASE_URL="{{ _claude_base_url | trim }}"
      export ANTHROPIC_API_KEY="{{ _claude_api_key | trim }}"
      export ANTHROPIC_MODEL="{{ claude_code_model }}"
      export DISABLE_UPDATES=1
    owner: "{{ student_name }}"

# DISABLE_UPDATES locks Claude Code's own updater; code-server can still
# bump Anthropic.claude-code via the editor extension updater. Pin that too.
#
# vscode-server's settings.json.j2 emits an extra trailing "}" when
# vscode_server_additional_settings is set, so strict from_json fails with
# "Extra data". Use raw_decode to take the first JSON object, then rewrite.
- name: Ensure code-server User settings directory exists
  ansible.builtin.file:
    path: "/home/{{ student_name }}/.local/share/code-server/User"
    state: directory
    owner: "{{ student_name }}"
    mode: "0755"

- name: Disable code-server extension auto-updates
  become_user: "{{ student_name }}"
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json
        from pathlib import Path

        path = Path("/home/{{ student_name }}/.local/share/code-server/User/settings.json")
        before = path.read_text(encoding="utf-8") if path.exists() else ""
        try:
            data = json.loads(before) if before.strip() else {}
        except json.JSONDecodeError:
            # Tolerates trailing junk (extra "}" from vscode-server template)
            data, _ = json.JSONDecoder().raw_decode(before.lstrip())
        if not isinstance(data, dict):
            data = {}
        data["extensions.autoUpdate"] = False
        data["extensions.autoCheckUpdates"] = False
        after = json.dumps(data, indent=2) + "\n"
        if after != before:
            path.write_text(after, encoding="utf-8")
            print("changed")
        else:
            print("ok")
  register: _cs_settings_update
  changed_when: "'changed' in _cs_settings_update.stdout"

# Note: claudeCode.disableLoginPrompt is set via vscode_server_additional_settings
# in the catalog YAML, which the vscode-server workload writes to settings.json.
